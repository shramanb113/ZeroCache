[workspace]
resolver = "2"
members = [
    "zerocache-core",
    "zerocache-ports",
    "zerocache-adapters-sled",
    "zerocache-adapters-redis",
    "zerocache-adapters-openai",
    "zerocache-adapters-mistral",
    "zerocache-adapters-gemini",
    "zerocache-adapters-huggingface",
    "zerocache-adapters-cloud",
    "zerocache-adapters-azure",
    "zerocache-adapters-bedrock",
    "zerocache-adapters-vertexai",
    "zerocache-http",
]

[workspace.package]
version = "0.1.0"
edition = "2021"

# Optimized for a small, self-contained release binary -- the Docker image is
# `FROM scratch` plus this binary, so its size is the image's size. `strip` drops
# symbols/debuginfo; thin LTO + one codegen unit trims dead code across crates.
# Deliberately NOT `panic = "abort"`: the app relies on catching panics from
# `spawn_blocking` store calls and propagating them (see app.rs).
[profile.release]
strip = true
lto = "thin"
codegen-units = 1
