services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  zerocache-http:
    build: .
    ports:
      - "8080:8080"
    environment:
      ZEROCACHE_STORAGE_BACKEND: redis
      ZEROCACHE_REDIS_URL: redis://redis:6379
    depends_on:
      redis:
        condition: service_healthy
