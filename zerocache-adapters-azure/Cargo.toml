[package]
name = "zerocache-adapters-azure"
version.workspace = true
edition.workspace = true

[dependencies]
zerocache-ports = { path = "../zerocache-ports" }
zerocache-adapters-cloud = { path = "../zerocache-adapters-cloud" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
httpmock = "0.7"
tokio = { version = "1", features = ["rt", "macros"] }
