[package]
name = "zerocache-http"
version.workspace = true
edition.workspace = true

[dependencies]
zerocache-core = { path = "../zerocache-core" }
zerocache-ports = { path = "../zerocache-ports" }
zerocache-adapters-sled = { path = "../zerocache-adapters-sled" }
zerocache-adapters-redis = { path = "../zerocache-adapters-redis" }
zerocache-adapters-openai = { path = "../zerocache-adapters-openai" }
zerocache-adapters-mistral = { path = "../zerocache-adapters-mistral" }
zerocache-adapters-gemini = { path = "../zerocache-adapters-gemini" }
zerocache-adapters-huggingface = { path = "../zerocache-adapters-huggingface" }
zerocache-adapters-cloud = { path = "../zerocache-adapters-cloud" }
zerocache-adapters-azure = { path = "../zerocache-adapters-azure" }
zerocache-adapters-bedrock = { path = "../zerocache-adapters-bedrock" }
zerocache-adapters-vertexai = { path = "../zerocache-adapters-vertexai" }
axum = "0.7"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal"] }
serde = { version = "1", features = ["derive"] }
prometheus = "0.13"
async-trait = "0.1"
futures = "0.3"
opentelemetry = "0.32.0"
opentelemetry_sdk = "0.32.1"
tracing = "0.1.44"
tracing-opentelemetry = "0.33.0"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
opentelemetry-otlp = { version = "0.32.0", default-features = false, features = ["grpc-tonic", "trace"] }
tower-http = { version = "0.7.0", features = ["trace"] }

[dev-dependencies]
serde_json = "1.0.151"
